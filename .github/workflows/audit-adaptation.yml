name: Retests et dossier audit DjoFin
on:
  push:
    branches: [simulation-p0]
    paths:
      - '.github/workflows/audit-adaptation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Valider les tests
        run: python -m unittest discover -s tests -v
      - name: Charger la reference versionnee et figee sur main
        run: |
          mkdir -p sortie/donnees
          BASE=https://raw.githubusercontent.com/Djohey/DjoFin/3a98d4af14204231afe637f1267040e6380ee8eb/data/reference
          curl --fail --silent --show-error --location --retry 2 "$BASE/CW8_PA_2020-01-01_2025-01-01.csv" --output sortie/donnees/CW8_PA_2020-01-01_2025-01-01.csv
          curl --fail --silent --show-error --location --retry 2 "$BASE/CW8_PA_2020-01-01_2025-01-01.json" --output sortie/donnees/CW8_PA_2020-01-01_2025-01-01.json
      - name: Verifier empreinte independante du CSV
        run: |
          python -c "from pathlib import Path; import hashlib; p=Path('sortie/donnees/CW8_PA_2020-01-01_2025-01-01.csv'); actual=hashlib.sha256(p.read_bytes()).hexdigest(); expected='26f29cd7f65e1c5c45bf6d81c519c0bd3ab8286a761470bdab33d8a1092b7454'; print('SHA256:',actual); assert actual==expected, 'Donnees historiques modifiees'"
      - name: Produire les résultats et le dossier audit
        run: |
          python -m scripts.audit_adaptation --csv sortie/donnees/CW8_PA_2020-01-01_2025-01-01.csv --metadata sortie/donnees/CW8_PA_2020-01-01_2025-01-01.json --sortie sortie/audit_adaptation.md
      - uses: actions/upload-artifact@v4
        with:
          name: DjoFin_Retests_Ablation_Python-${{ matrix.python-version }}
          path: sortie/
          if-no-files-found: error

  comparer:
    needs: audit
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer les deux rapports
        uses: actions/download-artifact@v4
        with:
          pattern: DjoFin_Retests_Ablation_Python-*
          path: comparaisons/
      - name: Comparer rapports et donnees detaillees
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path
          a = Path("comparaisons/DjoFin_Retests_Ablation_Python-3.11/audit_adaptation")
          b = Path("comparaisons/DjoFin_Retests_Ablation_Python-3.13/audit_adaptation")
          assert a.with_suffix(".md").read_bytes() == b.with_suffix(".md").read_bytes(), "Rapports divergents"
          left = json.loads(a.with_suffix(".json").read_text())
          right = json.loads(b.with_suffix(".json").read_text())
          def comparer(x, y, chemin="racine"):
              if isinstance(x, dict) and isinstance(y, dict):
                  assert x.keys() == y.keys(), chemin
                  for k in x:
                      comparer(x[k], y[k], chemin + "." + k)
              elif isinstance(x, list) and isinstance(y, list):
                  assert len(x) == len(y), chemin
                  for i, (v, w) in enumerate(zip(x, y)):
                      comparer(v, w, chemin + "[" + str(i) + "]")
              elif isinstance(x, (int, float)) and isinstance(y, (int, float)):
                  assert math.isclose(x, y, rel_tol=1e-12, abs_tol=1e-9), chemin
              else:
                  assert x == y, chemin
          comparer(left, right)
          print("Rapports identiques et JSON concordants (tolérance 1e-9).")
          PY

# Relance après correction du rapport

# Recalcul après corrections audit P0
