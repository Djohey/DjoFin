name: P0 simulation tests

on:
  push:
    branches: [simulation-p0]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check Python environment
        run: python3 --version
      - name: Compile simulation module
        run: python3 -m py_compile djofin/simulator.py djofin/news_triage.py djofin/evidence_ledger.py djofin/research_gate.py tests/test_simulator.py tests/test_research_gate.py
      - name: Run P0 tests
        run: python3 -m unittest discover -s tests -v

      - name: Compare wire formats offline (no Gemini API)
        run: python3 -m scripts.compare_wire_offline
