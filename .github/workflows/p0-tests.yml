name: P0 simulation tests

on:
  push:
    branches: [simulation-p0]
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile simulation module
        run: python -m py_compile djofin/simulator.py tests/test_simulator.py
      - name: Run P0 tests
        run: python -m unittest discover -s tests -v

      - name: Compare wire formats offline (no Gemini API)
        run: python -m scripts.compare_wire_offline
