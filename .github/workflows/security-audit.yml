name: Audit all production workflows and actual collector code
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout without stored credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Compile production writer and audit every workflow
        run: |
          python3 -m py_compile tools/djofin_trusted_writers.py scripts/audit_production_workflows.py
          python3 scripts/audit_production_workflows.py
          python3 -m unittest discover -s tests -v
