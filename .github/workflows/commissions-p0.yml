name: Simulations DjoFin avec commissions
on:
  push:
    branches: [simulation-p0]
    paths:
      - '.github/workflows/commissions-p0.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Vérifier les calculs
        run: python -m unittest discover -s tests -v
      - name: Installer les données historiques
        run: python -m pip install 'yfinance>=0.2.50,<2'
      - name: Récupérer CW8
        run: python -m scripts.freeze_etf --ticker CW8.PA --start 2020-01-01 --end 2025-01-01 --out sortie/donnees
      - name: Exécuter seize simulations
        run: |
          python -m scripts.comparer_commissions --csv sortie/donnees/CW8_PA_2020-01-01_2025-01-01.csv --metadata sortie/donnees/CW8_PA_2020-01-01_2025-01-01.json --sortie sortie/rapport_commissions.md
      - uses: actions/upload-artifact@v4
        with:
          name: DjoFin_16_simulations_commissions
          path: sortie/
          if-no-files-found: error

