name: Simulations DjoFin avec commissions
on:
  push:
    branches: [simulation-p0]
    paths:
      - '.github/workflows/commissions-p0.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Vérifier les calculs
        run: python -m unittest discover -s tests -v
      - name: Charger les prix historiques de reference, sans dependances externes
        run: |
          mkdir -p sortie/donnees
          BASE=https://raw.githubusercontent.com/Djohey/DjoFin/3a98d4af14204231afe637f1267040e6380ee8eb/data/reference
          curl --fail --silent --show-error --location "$BASE/CW8_PA_2020-01-01_2025-01-01.csv" --output sortie/donnees/CW8_PA_2020-01-01_2025-01-01.csv
          curl --fail --silent --show-error --location "$BASE/CW8_PA_2020-01-01_2025-01-01.json" --output sortie/donnees/CW8_PA_2020-01-01_2025-01-01.json
          echo "26f29cd7f65e1c5c45bf6d81c519c0bd3ab8286a761470bdab33d8a1092b7454  sortie/donnees/CW8_PA_2020-01-01_2025-01-01.csv" | sha256sum -c -
      - name: Exécuter seize simulations
        run: |
          python -m scripts.comparer_commissions --csv sortie/donnees/CW8_PA_2020-01-01_2025-01-01.csv --metadata sortie/donnees/CW8_PA_2020-01-01_2025-01-01.json --sortie sortie/rapport_commissions.md
      - uses: actions/upload-artifact@v4
        with:
          name: DjoFin_16_simulations_commissions
          path: sortie/
          if-no-files-found: error

# Relance après correction du moteur de frais

