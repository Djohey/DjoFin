name: Archivage quotidien des cours DjoFin
on:
  schedule:
    - cron: '20 7 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: djofin-market-archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: simulation-p0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer le fournisseur de donnees
        run: python -m pip install 'yfinance>=0.2.50,<2'
      - name: Archiver les observations recentes
        run: python -m scripts.archive_market_daily --ticker CW8.PA --lookback-days 21
      - name: Versionner sans ecraser les archives
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market_archive/
          git diff --cached --quiet && exit 0
          git commit -m "archive: CW8.PA daily immutable market snapshot"
          git push origin HEAD:simulation-p0
