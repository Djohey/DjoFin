name: DjoFin daily CW8 archive (trusted inline, no dependencies)
on:
  schedule:
    - cron: "20 19 * * 1-5"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: djofin-market-archive-writer
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout reviewed main commit without persisted token
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Execute tested shared collector
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: python3 tools/djofin_trusted_writers.py market
