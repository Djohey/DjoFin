name: P0 - Freeze ETF historical prices

on:
  push:
    branches: [simulation-p0]
    paths:
      - '.github/workflows/p0-freeze-etf.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Charger les prix historiques de reference, sans dependances externes
        run: |
          mkdir -p output/snapshots
          BASE=https://raw.githubusercontent.com/Djohey/DjoFin/3a98d4af14204231afe637f1267040e6380ee8eb/data/reference
          curl --fail --silent --show-error --location "$BASE/CW8_PA_2020-01-01_2025-01-01.csv" --output output/snapshots/CW8_PA_2020-01-01_2025-01-01.csv
          curl --fail --silent --show-error --location "$BASE/CW8_PA_2020-01-01_2025-01-01.json" --output output/snapshots/CW8_PA_2020-01-01_2025-01-01.json
          echo "26f29cd7f65e1c5c45bf6d81c519c0bd3ab8286a761470bdab33d8a1092b7454  output/snapshots/CW8_PA_2020-01-01_2025-01-01.csv" | sha256sum -c -
      - name: Upload frozen prices and provenance
        uses: actions/upload-artifact@v4
        with:
          name: p0-cw8-2020-2024-snapshot
          path: output/snapshots/
          if-no-files-found: error
          retention-days: 90
