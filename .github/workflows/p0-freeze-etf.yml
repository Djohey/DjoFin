name: P0 - Freeze ETF historical prices

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install historical price downloader
        run: python -m pip install 'yfinance>=0.2.50,<2'
      - name: Freeze CW8.PA EUR ETF prices for 2020-2024
        run: python -m scripts.freeze_etf --ticker CW8.PA --start 2020-01-01 --end 2025-01-01 --out output/snapshots
      - name: Upload frozen prices and provenance
        uses: actions/upload-artifact@v4
        with:
          name: p0-cw8-2020-2024-snapshot
          path: output/snapshots/
          if-no-files-found: error
          retention-days: 90
